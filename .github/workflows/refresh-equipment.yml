name: Refresh equipment catalogue

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-equipment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: pnpm/action-setup@v4
        with:
          version: 12.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test:equipment-sync
      - run: pnpm sync:equipment
      - run: pnpm build

      - name: Commit updated catalogue
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- src/data/generated/equipment.json)" ]]; then
            echo "Equipment catalogue is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/generated/equipment.json
          git commit -m "chore(data): refresh BG3 equipment catalogue"
          git push origin "HEAD:${GITHUB_REF_NAME}"
